# ASI-ARCHIVO: servidor central (una computadora o servidor que permanezca encendido).
#
# Servicios: base de datos, API, antivirus, HTTPS y respaldos diarios. Solo el puerto
# 443 (y 80, para redirigir a HTTPS) queda expuesto; la base de datos y la API no.
# Toda la configuración está en servidor/.env (ver .env.ejemplo y MANUAL_ADMINISTRADOR).
name: asi-archivo

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: asi_archivo
      POSTGRES_USER: asi_archivo
      POSTGRES_PASSWORD: ${ASI_DB_CONTRASENA:?Define ASI_DB_CONTRASENA en servidor/.env}
    volumes:
      - basedatos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asi_archivo -d asi_archivo"]
      interval: 10s
      retries: 10

  clamav:
    # Antivirus para los documentos que se suben. Descarga firmas actualizadas de
    # ClamAV (solo descarga; no envía archivos ni datos a ningún servicio).
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - firmas_antivirus:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      start_period: 300s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    image: asi-archivo-api:${ASI_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASI_ENTORNO: produccion
      ASI_DATABASE_URL: postgresql+psycopg://asi_archivo:${ASI_DB_CONTRASENA}@db:5432/asi_archivo
      ASI_SECRET_KEY: ${ASI_SECRET_KEY:?Define ASI_SECRET_KEY en servidor/.env}
      ASI_HOSTS_PERMITIDOS: '["${ASI_DOMINIO:?Define ASI_DOMINIO en servidor/.env}"]'
      ASI_ARCHIVO_RAIZ: /datos/documentos
      ASI_ARCHIVO_ANTIVIRUS_CMD: /usr/local/bin/asi-antivirus
      ASI_ARCHIVO_REQUERIR_ANTIVIRUS: "true"
      ASI_ARCHIVO_MAX_MB: ${ASI_ARCHIVO_MAX_MB:-20}
      ASI_TOKEN_MINUTOS: ${ASI_TOKEN_MINUTOS:-480}
      ASI_ZONA_HORARIA: ${ASI_ZONA_HORARIA:-America/Mexico_City}
      ASI_OCR_PROCESOS: ${ASI_OCR_PROCESOS:-2}
      TZ: ${ASI_ZONA_HORARIA:-America/Mexico_City}
    volumes:
      - documentos:/datos/documentos

  https:
    # Certificado automático. Con un dominio público, Let's Encrypt; en una red interna,
    # una autoridad propia (ASI_TLS=internal) cuyo certificado raíz se instala en las PCs.
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${ASI_PUERTO_HTTPS:-443}:443"
      - "${ASI_PUERTO_HTTP:-80}:80"
    environment:
      ASI_DOMINIO: ${ASI_DOMINIO}
      ASI_TLS: ${ASI_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
      - config_https:/config

  respaldos:
    # Respaldo diario de la base de datos y los documentos, con verificación.
    image: postgres:17-bookworm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/programar-respaldos.sh"]
    environment:
      PGHOST: db
      PGUSER: asi_archivo
      PGDATABASE: asi_archivo
      PGPASSWORD: ${ASI_DB_CONTRASENA}
      ASI_HORA_RESPALDO: ${ASI_HORA_RESPALDO:-02:30}
      ASI_RESPALDOS_CONSERVAR: ${ASI_RESPALDOS_CONSERVAR:-30}
      TZ: ${ASI_ZONA_HORARIA:-America/Mexico_City}
    volumes:
      - ./scripts:/scripts:ro
      - documentos:/datos/documentos:ro
      - ./respaldos:/respaldos

  restauracion:
    # Solo se usa al restaurar un respaldo (./asi.sh restaurar). No corre normalmente.
    image: postgres:17-bookworm
    profiles: ["restauracion"]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/restaurar-interno.sh"]
    environment:
      PGHOST: db
      PGUSER: asi_archivo
      PGDATABASE: asi_archivo
      PGPASSWORD: ${ASI_DB_CONTRASENA}
    volumes:
      - ./scripts:/scripts:ro
      - documentos:/datos/documentos
      - ./respaldos:/respaldos:ro

volumes:
  basedatos:
  documentos:
  firmas_antivirus:
  certificados:
  config_https:
