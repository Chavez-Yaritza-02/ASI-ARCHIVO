[project]
name = "asi-cliente"
version = "0.1.0"
description = "Aplicación de escritorio de ASI-ARCHIVO (PySide6), con modo local integrado"
requires-python = ">=3.12"
dependencies = [
    "asi-shared",
    # Modo local: la aplicación lleva dentro la API y la base SQLite.
    "asi-server",
    "pyside6>=6.8",
    "httpx>=0.28",
    "keyring>=25.5",
    # Usa los certificados de confianza del sistema (Windows), no solo los de Python.
    "truststore>=0.10",
]

[project.scripts]
asi-archivo = "asi_cliente.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asi_cliente"]
