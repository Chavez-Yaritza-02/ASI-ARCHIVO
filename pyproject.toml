[project]
name = "asi-archivo"
version = "0.1.0"
description = "Sistema de Asistencia y Archivo Digital — Jefatura de Electromecánica, TecMM Zapopan"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "server", "client"]

[tool.uv.sources]
asi-shared = { workspace = true }
asi-server = { workspace = true }
asi-cliente = { workspace = true }

[dependency-groups]
instalador = ["pyinstaller>=6.16,<7", "markdown>=3.7"]
dev = [
    "asi-shared",
    "asi-server",
    "asi-cliente",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "segno>=1.6",  # genera códigos QR para los PDF ficticios de prueba
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "asi_cliente", "asi_shared"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests", "herramientas/tests"]
addopts = "--import-mode=importlib"
timeout = 120  # una prueba que espera un diálogo sin respuesta falla en vez de colgarse
pythonpath = ["server/tests"]  # generador de PDFs ficticios
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx`",
    "ignore:builtin type (SwigPy|swigvarlink)",  # interno de PyMuPDF
]
