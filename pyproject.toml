[project]
name = "asi-archivo"
version = "0.1.0"
description = "Sistema de Asistencia y Archivo Digital — Jefatura de Electromecánica, TecMM Zapopan"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "server", "client"]

[tool.uv.sources]
asi-shared = { workspace = true }
asi-server = { workspace = true }
asi-cliente = { workspace = true }

[dependency-groups]
dev = [
    "asi-shared",
    "asi-server",
    "asi-cliente",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Solo para la herramienta de prueba de OCR (requiere Tesseract instalado en el sistema):
#   uv sync --group ocr
ocr = [
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
    "numpy>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "asi_cliente", "asi_shared", "analisis", "evaluar", "extraer"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests", "herramientas/tests"]
pythonpath = ["herramientas/ocr_prueba"]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
